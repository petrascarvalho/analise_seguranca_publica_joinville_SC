# Tema nativo do Streamlit 1.66. As cores são uma PROPOSTA visual inspirada na bandeira de Joinville
# (azul #074EA2 do arquivo SVG do projeto); não são códigos cromáticos oficiais do município.
# O CSS dos cards e do cabeçalho fica em dashboard/ui.py (função aplicar_estilo).
[theme]
base = "light"
primaryColor = "#074EA2"
backgroundColor = "#EAF4FC"
secondaryBackgroundColor = "#DCECF9"
textColor = "#20354F"
linkColor = "#074EA2"
borderColor = "#BFD6EB"
dataframeBorderColor = "#BFD6EB"
dataframeHeaderBackgroundColor = "#DCECF9"
font = "sans serif"
headingFontSizes = ["1.7rem", "1.35rem", "1.15rem", "1.05rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
metricValueFontSize = "2rem"
baseRadius = "0.6rem"
paddingTop = "2rem"
