# Tema do painel (recursos nativos do Streamlit 1.66; nenhum CSS próprio).
# Uma cor de destaque (o azul dos gráficos), fundo claro, bordas suaves e títulos menores para não quebrarem em várias linhas.
[theme]
base = "light"
primaryColor = "#2563A6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#1F2933"
linkColor = "#2563A6"
borderColor = "#D9E1EA"
dataframeBorderColor = "#E3E8EF"
dataframeHeaderBackgroundColor = "#F3F6FA"
font = "sans serif"
headingFontSizes = ["2.1rem", "1.5rem", "1.3rem", "1.05rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "2rem"
baseRadius = "0.6rem"
paddingTop = "3rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F3F6FA"
