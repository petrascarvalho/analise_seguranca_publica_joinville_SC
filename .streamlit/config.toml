# Tema nativo do Streamlit 1.66; ui.py permite quebra de linha nos deltas das métricas.
# Uma cor de destaque (o azul dos gráficos), fundo claro, bordas suaves e títulos menores para não quebrarem em várias linhas.
[theme]
base = "light"
primaryColor = "#104D9B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF3FC"
textColor = "#20354F"
linkColor = "#104D9B"
borderColor = "#C6D8ED"
dataframeBorderColor = "#C6D8ED"
dataframeHeaderBackgroundColor = "#EAF3FC"
font = "sans serif"
headingFontSizes = ["2.1rem", "1.5rem", "1.3rem", "1.05rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "2rem"
baseRadius = "0.6rem"
paddingTop = "3rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#EAF3FC"
